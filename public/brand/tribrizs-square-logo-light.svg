<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sqBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f2eb"/>
    </linearGradient>
  </defs>

  <!-- Square container with smooth rounded corners -->
  <rect width="512" height="512" rx="96" fill="url(#sqBgLight)"/>
  <rect width="508" height="508" x="2" y="2" rx="94" fill="none" stroke="#e2ddd2" stroke-width="2"/>

  <!-- Centered Brand Mark -->
  <g transform="translate(142, 90) scale(7.2)">
    <path d="M3 26.5C11 26.5 19 21 25.5 9.5" stroke="#0b1f3a" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <path d="M3 19.5C9 19.5 14 16.5 17.5 11" stroke="#0b1f3a" stroke-width="2.8" stroke-linecap="round" stroke-opacity="0.75" fill="none"/>
    <path d="M3 12.5C6 12.5 8.5 11.5 10 9.5" stroke="#0b1f3a" stroke-width="2.8" stroke-linecap="round" stroke-opacity="0.45" fill="none"/>
    <circle cx="27" cy="6" r="3.2" fill="#e86a42"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="360" text-anchor="middle" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="8" fill="#0b1f3a">TRIBRIZS</text>
  
  <!-- Subtle line accent -->
  <rect x="206" y="388" width="100" height="2" rx="1" fill="#e86a42"/>

  <!-- Subtitle Tagline -->
  <text x="256" y="422" text-anchor="middle" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" letter-spacing="5" fill="#34507a">FLIGHTS &amp; TRAVEL</text>
